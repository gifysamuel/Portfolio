<!DOCTYPE html>
<html>

<head>
    <title>Projects</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family:'Poppins',sans-serif;
        min-height:100vh;

        background:
        linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
        url("PP.avif");

        background-size:cover;
        background-position:center;
        background-attachment:fixed;

        animation:pageLoad 0.8s ease;
    }

    /* NAVBAR */

    .header{
        background:rgba(17,16,16,0.5);
        backdrop-filter:blur(10px);

        position:fixed;
        top:20px;
        left:15px;
        right:15px;

        padding:20px;
        border-radius:100px;

        display:flex;
        align-items:center;
        gap:30px;

        z-index:1000;

        transition:0.4s;
    }

    .header:hover{
        transform:translateY(-3px);
        box-shadow:0 10px 30px rgba(0,255,255,0.15);
    }

    .logo{
        margin-right:auto;
    }

    .Gify{
        border-radius:50%;
    }

    .header a{
        color:white;
        text-decoration:none;
        position:relative;
        transition:0.3s;
    }

    .header a:hover{
        color:cyan;
    }

    .header a::after{
        content:"";
        position:absolute;
        left:0;
        bottom:-5px;

        width:0%;
        height:2px;

        background:cyan;

        transition:0.3s;
    }

    .header a:hover::after{
        width:100%;
    }

    /* COMING SOON */

    .coming-container{
        min-height:100vh;

        display:flex;
        justify-content:center;
        align-items:center;

        text-align:center;
        flex-direction:column;
    }

    .coming-container h1{
        font-size:clamp(3rem,8vw,6rem);

        color:cyan;

        text-shadow:
        0 0 10px cyan,
        0 0 20px cyan,
        0 0 40px cyan;

        animation:glow 2s infinite alternate;
    }

    .coming-container p{
        color:white;
        margin-top:20px;
        font-size:1.2rem;
        opacity:0.8;
    }

    .loader-line{
        width:250px;
        height:5px;

        background:rgba(255,255,255,0.1);

        border-radius:20px;

        margin-top:30px;

        overflow:hidden;
    }

    .loader-line span{
        display:block;

        width:0%;
        height:100%;

        background:cyan;

        box-shadow:
        0 0 10px cyan,
        0 0 20px cyan;

        animation:load 3s infinite;
    }

    .footer{
        padding:50px 20px;

        text-align:center;

        background:rgba(17,16,16,0.5);

        backdrop-filter:blur(10px);

        border-top:1px solid rgba(0,255,255,0.2);
    }

    .footer h2{
        color:cyan;

        margin-bottom:10px;

        text-shadow:
        0 0 10px cyan,
        0 0 20px cyan;
    }

    .footer p{
        color:white;
        opacity:0.8;
    }

    

.socials
{
    margin: 25px 0;

    display: flex;
    justify-content: center;
    gap: 25px;
}

.socials a
{
    width: 50px;
    height: 50px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 50%;

    color: white;

    text-decoration: none;

    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(0,255,255,0.3);

    transition: 0.4s;
}

.socials a:hover
{
    color: cyan;

    transform: translateY(-8px) scale(1.1);

    box-shadow:
    0 0 15px cyan,
    0 0 30px cyan;
}

.socials i
{
    font-size: 22px;
}


    /* FOOTER */

    /* ANIMATIONS */

    @keyframes glow{
        from{
            text-shadow:
            0 0 10px cyan,
            0 0 20px cyan;
        }

        to{
            text-shadow:
            0 0 20px cyan,
            0 0 40px cyan,
            0 0 60px cyan;
        }
    }

    @keyframes load{
        0%{
            width:0%;
        }

        100%{
            width:100%;
        }
    }

    @keyframes pageLoad{
        from{
            opacity:0;
            transform:scale(0.98);
        }

        to{
            opacity:1;
            transform:scale(1);
        }
    }

    </style>
</head>

<body>

<div class="header">

    <div class="logo">
        <img class="Gify" src="Gify.png" width="50">
    </div>

    <a href="index.html">HOME</a>
    <a href="About.html">ABOUT ME</a>
    <a href="Projects.html">PROJECTS</a>
    <a href="Contact.html">CONTACT</a>

</div>

<div class="coming-container">

    <h1>COMING SOON</h1>

    <p>
        Exciting projects are being added to the portfolio 🚀
    </p>

    <div class="loader-line">
        <span></span>
    </div>

</div>



<footer class="footer">


    <div class="socials">

        <a href="https://github.com/gifysamuel" target="_blank"><i class="fab fa-github"></i></a>

        <a href="https://www.linkedin.com/in/gifysamuel" target="_blank">
            <i class="fab fa-linkedin"></i>
        </a>

        <a href="#"><i class="fab fa-instagram"></i></a>

        <a href="mailto:gifysamuelamarth@gmail.com">
            <i class="fas fa-envelope"></i>
        </a>

    </div>

    <p class="copyright">
        © 2026 Gify Samuel A. All Rights Reserved.
    </p>

</footer>
</body>
</html>
