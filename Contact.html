    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', sans-serif;
        min-height: 100vh;

        background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url("PP.avif");

        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        padding-top:120px;
        display: block;
        justify-content: center;
        align-items: center;

        animation: pageLoad 0.8s ease;
    }

    /* HEADER */
    .header {
        background: rgba(17,16,16,0.5);
        backdrop-filter: blur(10px);

        position: fixed;
        top: 20px;
        left: 15px;
        right: 15px;

        padding: 20px;
        border-radius: 100px;

        display: flex;
        align-items: center;
        gap: 30px;

        z-index: 1000;

        transition: 0.4s ease;
        animation: dropIn 0.8s ease;
    }

    .header:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(0,255,255,0.15);
    }

    .logo {
        margin-right: auto;
    }

    .Gify {
        border-radius: 50%;
    }

    .header a {
        color: white;
        text-decoration: none;
        position: relative;
        transition: 0.3s;
    }

    .header a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -5px;
        width: 0%;
        height: 2px;
        background: cyan;
        transition: 0.3s ease;
    }

    .header a:hover {
        color: cyan;
    }

    .header a:hover::after {
        width: 100%;
    }

    /* CONTACT BOX */
    .contact_box {
        color: white;
        text-align: center;
        animation: fadeIn 1s ease;
    }

    .contact_box h1 {
        font-size: 3rem;
        color: cyan;
        margin-bottom: 30px;
    }

    .contact_links {
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
    }


.footer
{
    margin-top: 100px;

    padding: 50px 20px;

    text-align: center;

    background: rgba(17,16,16,0.5);

    backdrop-filter: blur(10px);

    border-top: 1px solid rgba(0,255,255,0.2);
}

.footer h2
{
    color: cyan;

    margin-bottom: 10px;

    text-shadow:
    0 0 10px cyan,
    0 0 20px cyan;
}

.footer p
{
    color: white;

    opacity: 0.8;
}



.socials
{
    margin: 25px 0;

    display: flex;
    justify-content: center;
    gap: 25px;
}

.socials a
{
    width: 50px;
    height: 50px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 50%;

    color: white;
    text-decoration: none;

    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(0,255,255,0.3);

    transition: 0.4s;
}

.socials a:hover
{
    color: cyan;

    transform: translateY(-8px) scale(1.1);

    box-shadow:
    0 0 15px cyan,
    0 0 30px cyan;
}

.socials i
{
    font-size: 22px;
}

.copyright
{
    margin-top: 20px;
    font-size: 14px;
    opacity: 0.6;
}


    .contact_item {
        display: flex;
        align-items: center;
        gap: 12px;

        padding: 12px 22px;
        border-radius: 50px;

        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(0,255,255,0.3);

        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        cursor: pointer;
    }

    .contact_item:hover {
        transform: translateY(-6px) scale(1.05);
        background: rgba(0,255,255,0.12);
        box-shadow: 0 10px 25px rgba(0,255,255,0.15);
        border-color: cyan;
    }

    .contact_item i {
        font-size: 20px;
        color: cyan;
        transition: 0.4s ease;
    }

    .contact_item:hover i {
        transform: rotate(10deg) scale(1.2);
    }

    .contact_item a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        position: relative;
    }

    .contact_item a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -3px;
        width: 0%;
        height: 1px;
        background: cyan;
        transition: 0.3s;
    }

    .contact_item:hover a::after {
        width: 100%;
    }


    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes dropIn {
        from {
            opacity: 0;
            transform: translateY(-40px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes pageLoad {
        from {
            opacity: 0;
            transform: scale(0.98);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    </style>
</head>
